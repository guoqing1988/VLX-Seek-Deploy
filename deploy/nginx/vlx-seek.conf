# VLX-Seek Web 控制台 + API 反向代理
#
# 安装（软链，不做复制）：
#   ./deploy/nginx/install-nginx.sh install
#   # 等价于：sudo ln -sfn <repo>/deploy/nginx/vlx-seek.conf /etc/nginx/conf.d/vlx-seek.conf
#
# 访问： http://<host>:8188/
#   密码 = deploy/.env 里的 API_KEY（页面登录后调 /v1/vlx/info 校验，由服务端 API key 认证把关）
# 后端： VLX-Seek 常驻服务（默认 127.0.0.1:8110）

server {
    listen 8188;
    listen [::]:8188;
    server_name _;

    # 图片以 base64 提交，最大 32 MB（与服务 --max-body-mb 默认一致）
    client_max_body_size 32m;
    client_body_timeout 120s;

    # 静态控制台
    root /data/www/VLX-Seek-GGML/deploy/web;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # 异步接口 + 任务查询 + PNG 下载（同步 OpenAI 接口最长 300 s）
    location /v1/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # 探活（页面顶部状态条用，不需要 key）
    location = /healthz {
        proxy_pass http://127.0.0.1:8110/healthz;
        proxy_set_header Host $host;
    }

    # Prometheus 指标（受服务 API key 保护）
    location = /metrics {
        proxy_pass http://127.0.0.1:8110/metrics;
        proxy_set_header Host $host;
    }
}
